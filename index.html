<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico de Campanha – Potencializa</title>
<style>
:root{--dark:#0C3228;--mid:#124236;--green:#2EAE74;--light:#5DCAA5;--muted:rgba(255,255,255,0.58);--surface:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.10);--bg:#F4F4F2;--surface2:#fff;--border2:rgba(0,0,0,0.08);--text2:#1a1a1a;--text3:#555;--text4:#999;--r:12px;--rs:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden;background:var(--bg);color:var(--text2)}
#tela-calc{background:var(--bg);color:var(--text2);min-height:100vh;padding:2rem 1rem}
.calc-page{max-width:960px;margin:0 auto}
.brand-bar{background:var(--mid);border-radius:var(--r);padding:.875rem 1.5rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.brand-left{display:flex;align-items:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:-0.02em}
.period-wrap{display:flex;align-items:center;gap:8px}
.period-label{color:rgba(255,255,255,.45);font-size:12px}
.period-input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:7px;color:#fff;font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;padding:5px 10px;outline:none;width:110px;text-align:center}
.period-input::placeholder{color:rgba(255,255,255,.3)}
.layout{display:grid;grid-template-columns:220px 1fr;gap:1rem;align-items:start}
.slabel{font-size:10px;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.1em;margin:.875rem 0 .4rem;padding-left:2px}
.icard{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rs);padding:.75rem 1rem;margin-bottom:.4rem}
.icard label{font-size:10px;color:var(--text4);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.icard input[type=number]{width:100%;font-family:'Outfit',sans-serif;font-size:18px;font-weight:500;border:none;outline:none;color:var(--text2);background:transparent;padding:0}
.icard input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.hint{font-size:10px;color:var(--text4);margin-top:2px}
.right-col{display:flex;flex-direction:column;gap:.875rem}
.card{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:1.25rem}
.ctitle{font-size:10px;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.875rem}
.funnel-wrap{display:flex;flex-direction:column;align-items:center;width:100%}
.fstep{width:100%;display:flex;flex-direction:column;align-items:center;margin-bottom:3px}
.fstep-meta{display:flex;justify-content:space-between;width:100%;padding:0 2px;margin-bottom:5px}
.fname{font-size:11px;color:var(--text3)}
.fval{font-size:12px;font-weight:600;color:var(--text2)}
.fbar-outer{width:100%;display:flex;justify-content:center}
.fbar-inner{height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;transition:width .5s cubic-bezier(.4,0,.2,1);overflow:hidden}
.fbar-txt{font-size:12px;font-weight:600;white-space:nowrap;padding:0 12px}
.connector{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;width:100%}
.conv-row{display:flex;align-items:center;justify-content:center;gap:6px}
.bpill{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
.bref{font-size:10px;color:var(--text4)}
.otimo{background:#E1F5EE;color:#085041}
.bom{background:#FAEEDA;color:#854F0B}
.ruim{background:#FCEBEB;color:#A32D2D}
.vazio{background:#f0f0ee;color:var(--text4)}
.arr{color:var(--text4);font-size:13px}
.mg{display:grid;gap:8px}
.mg-2{grid-template-columns:1fr 1fr}
.mg-3{grid-template-columns:repeat(3,1fr)}
.divider{height:1px;background:var(--border2);margin:.75rem 0}
.mc{background:#f5f5f3;border-radius:var(--rs);padding:11px 14px}
.mc.hi{background:var(--mid)}
.mc.ok{border-left:3px solid var(--green);border-radius:0 var(--rs) var(--rs) 0}
.mc.bad{border-left:3px solid #E24B4A;border-radius:0 var(--rs) var(--rs) 0}
.mc-lbl{font-size:10px;color:var(--text4);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-weight:500}
.mc.hi .mc-lbl{color:var(--light)}
.mc-val{font-size:15px;font-weight:600;color:var(--text2);line-height:1}
.mc.hi .mc-val{color:#fff;font-size:20px}
.mc-sub{font-size:10px;color:var(--text4);margin-top:3px}
.mc.hi .mc-sub{color:rgba(255,255,255,.4)}
.mc.ok .mc-sub{color:#0F6E56;font-weight:500}
.mc.bad .mc-sub{color:#A32D2D;font-weight:500}
.diag{border-radius:var(--r);padding:1rem 1.25rem;border:1px solid transparent}
.diag.s{background:#E1F5EE;border-color:#9FE1CB}
.diag.w{background:#FEF3E2;border-color:#FAC775}
.diag.d{background:#FCEBEB;border-color:#F7C1C1}
.diag-head{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.dots{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%}
.diag-title{font-size:14px;font-weight:600}
.diag.s .diag-title{color:#085041}
.diag.w .diag-title{color:#854F0B}
.diag.d .diag-title{color:#A32D2D}
.diag-body{font-size:12px;line-height:1.7}
.diag.s .diag-body{color:#0F6E56}
.diag.w .diag-body{color:#9A6010}
.diag.d .diag-body{color:#A32D2D}
@media(max-width:768px){.layout{grid-template-columns:1fr}.mg-3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="tela-calc">
  <div class="calc-page">
    <div class="brand-bar">
      <div class="brand-left">Potencializa</div>
      <div class="period-wrap"><span class="period-label">Período</span><input class="period-input" type="text" placeholder="Maio 2026" maxlength="20"></div>
    </div>

    <div id="panel-s">
      <div class="layout">
        <div>
          <div class="slabel">Funil</div>
          <div class="icard"><label>Impressões</label><input type="number" id="s-imp" value="48200" oninput="calcS()"></div>
          <div class="icard"><label>Cliques</label><input type="number" id="s-cli" value="4960" oninput="calcS()"></div>
          <div class="icard"><label>Leads</label><input type="number" id="s-lea" value="101" oninput="calcS()"></div>
          <div class="icard"><label>Oportunidades</label><input type="number" id="s-ops" value="58" oninput="calcS()"></div>
          <div class="icard"><label>Vendas fechadas</label><input type="number" id="s-ven" value="13" oninput="calcS()"></div>
          <div class="slabel">Financeiro</div>
          <div class="icard"><label>Valor investido (R$)</label><input type="number" id="s-verba" value="4940" oninput="calcS()"></div>
          <div class="icard"><label>Faturamento total (R$)</label><input type="number" id="s-fat" value="39000" oninput="calcS()"></div>
          <div class="icard"><label>CAC teto (R$)</label><input type="number" id="s-cact" value="500" oninput="calcS()"><div class="hint">limite máximo aceitável</div></div>
        </div>
        <div class="right-col">
          <div class="card"><div class="ctitle">Diagnóstico de Campanha</div><div class="funnel-wrap" id="funnelS"></div></div>
          <div class="card">
            <div class="mg mg-2" style="margin-bottom:8px">
              <div class="mc hi"><div class="mc-lbl">Faturamento</div><div class="mc-val" id="s-fat-v">—</div><div class="mc-sub">receita no período</div></div>
              <div class="mc"><div class="mc-lbl">ROAS</div><div class="mc-val" id="s-roas-v">—</div><div class="mc-sub">retorno sobre investimento</div></div>
            </div>
            <div class="divider"></div>
            <div class="mg mg-3" style="margin-top:8px">
              <div class="mc"><div class="mc-lbl">Ticket médio</div><div class="mc-val" id="s-tick-v">—</div><div class="mc-sub">fat. ÷ vendas</div></div>
              <div class="mc" id="s-cac-card"><div class="mc-lbl">CAC calculado</div><div class="mc-val" id="s-cac-v">—</div><div class="mc-sub" id="s-cac-sub">investido ÷ vendas</div></div>
              <div class="mc"><div class="mc-lbl">CAC teto</div><div class="mc-val" id="s-cact-v">—</div><div class="mc-sub">limite definido</div></div>
            </div>
          </div>
          <div id="diagS"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const FCOLORS=[["#0D3B2E","#fff"],["#1B5C4B","#fff"],["#2EAE74","#fff"],["#6DCF6D","#124236"],["#AADF3E","#124236"]];
function v(id){return parseFloat(document.getElementById(id).value)||0;}
function fmtN(n){return Math.round(n).toLocaleString("pt-BR");}
function fmtR(n){return "R$ "+Math.round(n).toLocaleString("pt-BR");}
function fmtP(n){return (n*100).toFixed(1)+"%";}
function set(id,val){document.getElementById(id).textContent=val;}

function classifyRate(r,nome,ref1,ref2,ref3,ref4){
  if(!r)return{cls:"vazio",label:"—",ref:""};
  if(ref4&&r>=ref4)return{cls:"otimo",label:nome+" "+fmtP(r)+" — excelente",ref:"meta >"+fmtP(ref4)};
  if(r>=ref3)return{cls:"otimo",label:nome+" "+fmtP(r)+" — ótimo",ref:"meta >"+fmtP(ref3)};
  if(r>=ref2)return{cls:"bom",label:nome+" "+fmtP(r)+" — bom, cabe melhora",ref:"meta >"+fmtP(ref3)};
  if(ref1&&r>=ref1)return{cls:"bom",label:nome+" "+fmtP(r)+" — razoável",ref:"meta >"+fmtP(ref2)};
  return{cls:"ruim",label:nome+" "+fmtP(r)+" — precisa ajustar",ref:"meta >"+(ref1?fmtP(ref1):fmtP(ref2))};
}

function logScale(values){const lv=values.map(v=>v>0?Math.log(v+1):0);const mx=Math.max(...lv)||1;return lv.map(l=>l>0?30+(l/mx)*70:30);}

function renderFunnel(cid,steps){
  const pcts=logScale(steps.map(s=>s.val));
  let h="";
  steps.forEach((s,i)=>{
    const pct=s.val>0?pcts[i]:30;
    const[bg,fg]=FCOLORS[Math.min(i,FCOLORS.length-1)];
    h+=`<div class="fstep"><div class="fstep-meta"><span class="fname">${s.label}</span><span class="fval">${s.val>0?fmtN(s.val):"—"}</span></div><div class="fbar-outer"><div class="fbar-inner" style="width:${pct.toFixed(1)}%;background:${bg}"><span class="fbar-txt" style="color:${fg}">${s.val>0?fmtN(s.val):""}</span></div></div></div>`;
    if(i<steps.length-1&&steps[i+1].conv!==undefined){
      const next=steps[i+1];
      const ct=classifyRate(next.conv,next.nome,next.r1,next.r2,next.r3,next.r4);
      h+=`<div class="connector"><span class="arr">↓</span><div class="conv-row"><span class="bpill ${ct.cls}">${ct.label}</span><span class="bref">${ct.ref}</span></div></div>`;
    }
  });
  document.getElementById(cid).innerHTML=h;
}

function renderDiag(id,score,lines){
  const n=Math.round(Math.min(5,score));
  const col=n>=4?"#2EAE74":n>=3?"#F0A030":"#E24B4A";
  const cls=n>=4?"s":n>=3?"w":"d";
  const title=n>=4?"Campanha saudável":n>=3?"Pontos de atenção":"Precisa de ajustes";
  const dots=Array.from({length:5},(_,i)=>`<div class="dot" style="background:${i<n?col:"#ddd"}"></div>`).join("");
  document.getElementById(id).innerHTML=`<div class="diag ${cls}"><div class="diag-head"><div class="dots">${dots}</div><div class="diag-title">${title}</div></div><div class="diag-body">${lines.join("<br>")}</div></div>`;
}

function calcS(){
  const imp=v("s-imp")||1,cli=v("s-cli"),lea=v("s-lea"),ops=v("s-ops"),ven=v("s-ven"),verba=v("s-verba"),fat=v("s-fat"),cact=v("s-cact");
  const tick=ven>0?fat/ven:0,cac=ven>0?verba/ven:0,roas=verba>0?fat/verba:0;
  const ctr=cli/imp,cl=cli>0?lea/cli:0,lo=lea>0?ops/lea:0,ov=ops>0?ven/ops:0;
  const cacOk=cac>0&&cac<=cact;
  set("s-fat-v",fat>0?fmtR(fat):"—");
  set("s-roas-v",roas>0?roas.toFixed(2)+"x":"—");
  set("s-tick-v",tick>0?fmtR(tick):"—");
  set("s-cac-v",cac>0?fmtR(cac):"—");
  set("s-cact-v",cact>0?fmtR(cact):"—");
  const cc=document.getElementById("s-cac-card"),cs=document.getElementById("s-cac-sub");
  cc.className="mc"+(cac>0?(cacOk?" ok":" bad"):"");
  cs.textContent=cac>0?(cacOk?"✓ dentro do teto":"✗ acima do teto"):"investido ÷ vendas";
  renderFunnel("funnelS",[
    {label:"Impressões",val:imp},
    {label:"Cliques",val:cli,conv:ctr,nome:"CTR",r1:.05,r2:.05,r3:.10,r4:null},
    {label:"Leads",val:lea,conv:cl,nome:"Tx. Conv. Site",r1:null,r2:.10,r3:.15,r4:.20},
    {label:"Oportunidades",val:ops,conv:lo,nome:"Tx. Leads Qualificados",r1:null,r2:.30,r3:.50,r4:null},
    {label:"Vendas",val:ven,conv:ov,nome:"Tx. Fechamento",r1:.10,r2:.20,r3:.30,r4:.40}
  ]);
  let score=0,lines=[];
  if(ctr>=.10)score++;else if(ctr>=.05)score+=.5;
  if(cl>=.20)score++;else if(cl>=.15)score+=.75;else if(cl>=.10)score+=.5;
  if(lo>=.50)score++;else if(lo>=.30)score+=.5;
  if(ov>=.40)score++;else if(ov>=.30)score+=.75;else if(ov>=.20)score+=.5;else if(ov>=.10)score+=.25;
  if(cacOk)score++;else if(cac>0&&cac<=cact*1.2)score+=.5;
  if(cli>0&&ctr<.05)lines.push("CTR abaixo de 5% — precisa ajustar títulos e segmentação");
  else if(cli>0&&ctr<.10)lines.push("CTR entre 5–10% — bom, mas cabe melhora nos criativos");
  if(lea>0&&cl<.10)lines.push("Tx. Conv. Site abaixo de 10% — revisar landing page");
  else if(lea>0&&cl<.15)lines.push("Tx. Conv. Site entre 10–15% — bom, meta é acima de 15%");
  if(ops>0&&lo<.30)lines.push("Tx. Leads Qualificados abaixo de 30% — revisar critérios de qualificação");
  if(ven>0&&ov<.10)lines.push("Tx. Fechamento abaixo de 10% — processo comercial precisa de atenção urgente");
  else if(ven>0&&ov<.20)lines.push("Tx. Fechamento entre 10–20% — razoável, meta é acima de 20%");
  else if(ven>0&&ov<.30)lines.push("Tx. Fechamento entre 20–30% — bom, meta é acima de 30%");
  if(cac>0&&!cacOk)lines.push("CAC acima do teto — reduzir CPC ou melhorar conversão");
  if(!lines.length)lines.push("Todas as métricas dentro das metas. Continue otimizando!");
  renderDiag("diagS",score,lines);
}

calcS();
</script>
</body>
</html>
